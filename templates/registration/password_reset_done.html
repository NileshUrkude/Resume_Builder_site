{% extends 'base.html' %}
{% block title %}Email sent{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card p-8 text-center">
    <h1 class="text-xl font-bold text-slate-900 dark:text-white">Check your email</h1>
    <p class="mt-3 text-sm text-slate-600 dark:text-slate-400">If an account exists for that address, we've sent password reset instructions.</p>
    <a href="{% url 'login' %}" class="btn-primary mt-6 inline-flex">Back to login</a>
</div>
{% endblock %}
