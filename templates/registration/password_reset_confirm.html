{% extends 'base.html' %}
{% block title %}Set new password{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
    <div class="card p-8">
        <div class="text-center">
            <i class="bi bi-key text-3xl text-brand-600"></i>
            <h1 class="mt-3 text-2xl font-bold text-slate-900 dark:text-white">Set new password</h1>
            <p class="mt-1 text-sm text-slate-500">Choose a strong new password for your account.</p>
        </div>
        <form method="post" class="mt-6 space-y-4">
            {% csrf_token %}
            {% for field in form %}
            {% include 'includes/form_field.html' with field=field %}
            {% endfor %}
            <button type="submit" class="btn-primary w-full py-3">Update password</button>
        </form>
    </div>
</div>
{% endblock %}
