<!DOCTYPE html>
<html>
<head>
    <title>Resume Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f6fa;">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/dashboard/">Resume Builder</a>

    {% if user.is_authenticated %}
    <div>
        <a href="/view/t1/" class="btn btn-outline-light">T1</a>
        <a href="/view/t2/" class="btn btn-outline-light">T2</a>
        <a href="/view/t3/" class="btn btn-outline-light">T3</a>
    </div>

    <div class="ms-auto">
        <a href="/dashboard/" class="btn btn-light">Dashboard</a>
        <a href="{% url 'create_resume' %}?next={{ selected_template }}" class="btn btn-warning">Edit</a>
        <a href="/logout/" class="btn btn-danger">Logout</a>
    </div>
    {% endif %}
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
