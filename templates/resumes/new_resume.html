{% extends 'base.html' %}
{% block title %}New resume{% endblock %}
{% block page_heading %}New resume{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
    <div class="card p-8">
        <div class="text-center">
            <i class="bi bi-file-earmark-plus text-4xl text-brand-600"></i>
            <h1 class="mt-3 text-xl font-bold text-slate-900 dark:text-white">Create a new resume</h1>
            <p class="mt-1 text-sm text-slate-500">Give it a name so you can tell resumes apart.</p>
        </div>
        <form method="post" class="mt-6">
            {% csrf_token %}
            <label for="resume_name" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Resume name</label>
            <input id="resume_name" name="resume_name" class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100" placeholder="e.g. Tech role, Internship" required autofocus>
            <button type="submit" class="btn-primary mt-5 inline-flex w-full items-center justify-center gap-2 py-3"><i class="bi bi-plus-lg"></i> Create resume</button>
        </form>
        <p class="mt-4 text-center text-sm text-slate-500"><a href="{% url 'my_resumes' %}" class="text-brand-600 hover:underline">← Back to my resumes</a></p>
    </div>
</div>
{% endblock %}
