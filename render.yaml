# Render Blueprint — optional one-click style deploy
# Dashboard: New → Blueprint → connect this repo
# After create: set ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS to your
# real https://YOUR-SERVICE.onrender.com hostname.

databases:
  - name: resume-builder-db
    plan: free

services:
  - type: web
    name: resume-builder
    runtime: python
    plan: free
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn Resume_Builder.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_VERSION
        value: "20"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: resume-builder-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
